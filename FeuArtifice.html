<!doctype html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feu d'Artifice Bastille</title>
<style>
  body{margin:0;overflow:hidden;background:#000}
  #bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:.8}
  canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
</style>
</head>
<body>
<img id="bg" src="EiffelFireworks.png" >
<canvas id="c"></canvas>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,fx=[],ps=[],sm=[],ac=new(AudioContext||webkitAudioContext);
const cols=['#ed2939','#ffffff','#002395'];

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
function boom(){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=60;g.gain.value=.2;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.5);g.gain.exponentialRampToValueAtTime(.01,ac.currentTime+.5)}
function launch(){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(250,ac.currentTime);o.frequency.exponentialRampToValueAtTime(450,ac.currentTime+.12);g.gain.setValueAtTime(.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.12)}
function crackle(){const b=ac.createBuffer(1,ac.sampleRate*.2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*.5-0.25;const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.value=.1;s.connect(g);g.connect(ac.destination);s.start()}

class Firework{constructor(x,y,tx,ty){this.x=x;this.y=y;this.tx=tx;this.ty=ty;this.vx=(tx-x)/55;this.vy=(ty-y)/55;this.life=0}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.015;this.life++;const d=Math.hypot(this.tx-this.x,this.ty-this.y);if(d<3||this.life>110){for(let i=0;i<300;i++)ps.push(new Particle(this.x,this.y));boom();crackle();return false}return true}draw(){ctx.beginPath();ctx.arc(this.x,this.y,1.2,0,7);ctx.fillStyle='#fff';ctx.fill()}}
class Particle{constructor(x,y){this.x=x;this.y=y;this.vx=(Math.random()-0.5)*6;this.vy=Math.random()*-4-3;this.size=Math.random()*1.8+1.2;this.life=Math.random()*120+60;this.col=cols[Math.floor(Math.random()*cols.length)];this.g=Math.random()*.02+.02;this.w=Math.random()*2-1}update(){this.vx+=this.w*.01;this.vy+=this.g;this.x+=this.vx;this.y+=this.vy;this.life--;if(this.life===0)sm.push(new Smoke(this.x,this.y));return this.life>0}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,7);ctx.fillStyle=this.col;ctx.fill()}}
class Smoke{constructor(x,y){this.x=x;this.y=y;this.vx=(Math.random()-0.5)*.5;this.vy=Math.random()*.5-1;this.size=Math.random()*4+1;this.life=200;this.a=0}update(){this.x+=this.vx;this.y+=this.vy;this.vx*=.97;this.vy*=.97;this.life--;this.a=Math.min(this.life/200,0.25);this.size+=.01;return this.life>0}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,7);ctx.fillStyle=`rgba(180,180,200,${this.a})`;ctx.fill()}}

resize();addEventListener('resize',resize);
addEventListener('click',e=>{fx.push(new Firework(e.clientX,h,e.clientX,Math.random()*.5*h+.15*h));launch()});
addEventListener('touchstart',e=>{e.preventDefault();fx.push(new Firework(e.touches[0].clientX,h,e.touches[0].clientX,Math.random()*.5*h+.15*h));launch()});

function loop(){
  requestAnimationFrame(loop);
  ctx.clearRect(0,0,w,h);
  fx.forEach((f,i)=>{if(!f.update())fx.splice(i,1);else f.draw()});
  ps.forEach((p,i)=>{if(!p.update())ps.splice(i,1);else p.draw()});
  sm.forEach((s,i)=>{if(!s.update())sm.splice(i,1);else s.draw()});
}
loop();
document.addEventListener('click',()=>ac.resume(),{once:true});
</script>
</body>
</html>
