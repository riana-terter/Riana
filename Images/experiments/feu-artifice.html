  #sky { position: fixed; inset: 0; display: block; cursor: crosshair; touch-action: manipulation; }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 20px 24px 40px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(6,11,26,0.6), transparent);
    z-index: 3;
  }
  .title-block { pointer-events: none; }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 700; font-size: clamp(22px, 4vw, 34px);
    letter-spacing: 0.01em; line-height: 1.1;
    text-shadow: 0 2px 14px rgba(0,0,0,0.7);
  }
  h1 .accent { color: var(--gold); font-style: italic; }
  .subtitle {
    font-size: clamp(11px, 1.6vw, 13px); font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(234,240,255,0.7); margin-top: 6px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.7);
  }
  .tricolore { display: inline-flex; gap: 3px; margin-right: 10px; vertical-align: middle; }
  .tricolore i { width: 5px; height: 14px; border-radius: 2px; display: block; }
  .tricolore i:nth-child(1) { background: var(--bleu); }
  .tricolore i:nth-child(2) { background: #fff; }
  .tricolore i:nth-child(3) { background: var(--rouge); }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; pointer-events: auto; }
  button {
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px;
    color: var(--ink);
    background: rgba(10,20,45,0.7);
    border: 1px solid rgba(234,240,255,0.25);
    border-radius: var(--radius);
    padding: 8px 14px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background 0.2s, border-color 0.2s, transform 0.1s;
  }
  button:hover { background: rgba(30,48,92,0.85); border-color: rgba(234,240,255,0.5); }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button.on { border-color: var(--gold); color: var(--gold); }
  button.finale {
    background: linear-gradient(135deg, rgba(74,127,224,0.4), rgba(255,90,78,0.4));
    border-color: rgba(255,212,112,0.55);
  }
  button.finale:hover { border-color: var(--gold); }

  #hint {
    position: fixed; bottom: 24vh; left: 50%; transform: translateX(-50%);
    font-size: clamp(13px, 2vw, 16px); font-weight: 600;
    letter-spacing: 0.06em;
    color: rgba(234,240,255,0.85);
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
    pointer-events: none;
    animation: breathe 2.6s ease-in-out infinite;
    transition: opacity 1s;
    z-index: 2;
    text-align: center; padding: 0 20px;
  }
  #hint.hidden { opacity: 0; }
  @keyframes breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

  footer {
    position: fixed; bottom: 10px; left: 0; right: 0;
    text-align: center; font-size: 11px; font-weight: 600;
    letter-spacing: 0.1em;
    color: rgba(234,240,255,0.5);
    text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    pointer-events: none; z-index: 3;
  }

  @media (prefers-reduced-motion: reduce) { #hint { animation: none; } }
  @media (max-width: 640px) {
    header { flex-direction: column; gap: 12px; }
    .controls { justify-content: flex-start; }
    #hint { bottom: 30vh; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<header>
  <div class="title-block">
    <h1><span class="tricolore"><i></i><i></i><i></i></span>Feu d'<span class="accent">Artifice</span></h1>
    <div class="subtitle" id="subtitle">14 juillet · Fête nationale</div>
  </div>
  <div class="controls">
    <button id="btnSound" aria-pressed="false">🔇 <span>Son</span></button>
    <button id="btnAuto" aria-pressed="false"><span>Spectacle auto</span></button>
    <button id="btnFinale" class="finale"><span>Bouquet final</span></button>
    <button id="btnLang">EN</button>
  </div>
</header>

<div id="hint">Touchez le ciel pour lancer une fusée ✨</div>
<footer id="credit">#100AIExperiments · rianago.com</footer>

<script>
'use strict';

/* ============================== i18n ============================== */
const STRINGS = {
  fr: {
    subtitle: '14 juillet · Fête nationale',
    sound: 'Son',
    auto: 'Spectacle auto',
    finale: 'Bouquet final',
    hint: 'Touchez le ciel pour lancer une fusée ✨',
    lang: 'EN'
  },
  en: {
    subtitle: 'July 14 · Bastille Day',
    sound: 'Sound',
    auto: 'Auto show',
    finale: 'Grand finale',
    hint: 'Tap the sky to launch a rocket ✨',
    lang: 'FR'
  }
};
let lang = 'fr';

/* ============================== Canvas ============================== */
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

/* ============================== Palette ============================== */
// Matched to the reference: gold-dominant, with red, silver-white,
// ice blue, and a hint of pale green. No rainbow tones.
const COLORS = {
  gold:   { h: 42,  s: 95, l: 66 },
  blanc:  { h: 220, s: 25, l: 92 },   // silver-white
  rouge:  { h: 4,   s: 90, l: 60 },
  bleu:   { h: 205, s: 70, l: 70 },   // icy blue
  vert:   { h: 140, s: 45, l: 68 }    // pale silvery green
};
// Weighted: gold and silver dominate, like a real show
const PALETTE = [
  COLORS.gold, COLORS.gold, COLORS.gold,
  COLORS.blanc, COLORS.blanc,
  COLORS.rouge, COLORS.rouge,
  COLORS.bleu,
  COLORS.vert
];
const TRICOLORE = [COLORS.bleu, COLORS.blanc, COLORS.rouge];
function hsl(c, l, a) {
  return `hsla(${c.h},${c.s}%,${l !== undefined ? l : c.l}%,${a !== undefined ? a : 1})`;
}
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ============================== Audio ============================== */
let audioCtx = null, masterGain = null, soundOn = false;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.5;
  masterGain.connect(audioCtx.destination);
}

function noiseBuffer(duration) {
  const len = Math.floor(audioCtx.sampleRate * duration);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  return buf;
}

function playLaunch() {
  if (!soundOn || !audioCtx) return;
  const t = audioCtx.currentTime;
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuffer(0.7);
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = 9;
  bp.frequency.setValueAtTime(600, t);
  bp.frequency.exponentialRampToValueAtTime(2400, t + 0.65);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.05, t);
  g.gain.exponentialRampToValueAtTime(0.012, t + 0.65);
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + 0.7);
}

function playBoom(size) {
  if (!soundOn || !audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(130, t);
  osc.frequency.exponentialRampToValueAtTime(32, t + 0.38);
  const og = audioCtx.createGain();
  og.gain.setValueAtTime(0.55 * size, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
  osc.connect(og); og.connect(masterGain);
  osc.start(t); osc.stop(t + 0.48);
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuffer(1.4);
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(5500, t);
  lp.frequency.exponentialRampToValueAtTime(280, t + 1.2);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.45 * size, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 1.3);
  src.connect(lp); lp.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + 1.4);
}

function playCrackle() {
  if (!soundOn || !audioCtx) return;
  const t0 = audioCtx.currentTime;
  for (let i = 0; i < 14; i++) {
    const t = t0 + rand(0, 1.0);
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer(0.03);
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 3000;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.07, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    src.connect(hp); hp.connect(g); g.connect(masterGain);
    src.start(t); src.stop(t + 0.04);
  }
}

/* ============================== Fireworks ============================== */
const rockets = [];
const particles = [];
const smoke = [];
const MAX_PARTICLES = reducedMotion ? 1200 : 4200;
const MAX_SMOKE = reducedMotion ? 24 : 70;
const SHELLS = ['peony', 'peony', 'tricolore', 'willow', 'crackle', 'chrys', 'double', 'palm'];

function spawnSmoke(x, y, color, amount) {
  const n = Math.floor(amount * (reducedMotion ? 0.5 : 1));
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2);
    const d = rand(0, 40);
    smoke.push({
      x: x + Math.cos(a) * d,
      y: y + Math.sin(a) * d,
      vx: rand(-0.25, 0.35),          // slight drift, light breeze to the right
      vy: rand(-0.35, -0.08),         // smoke rises slowly
      r: rand(14, 30),                // starting radius
      growth: rand(0.10, 0.22),       // expands over time
      life: 1,
      decay: rand(0.0018, 0.0032),    // lingers several seconds
      tint: color                      // faint color memory of the burst
    });
  }
  if (smoke.length > MAX_SMOKE) smoke.splice(0, smoke.length - MAX_SMOKE);
}

function launch(tx, ty, forcedShell) {
  const sx = rand(W * 0.2, W * 0.8);
  rockets.push({
    x: sx, y: H,
    tx, ty: Math.max(ty, H * 0.08),
    vx: (tx - sx) / 80,
    vy: -rand(10, 12.5),
    shell: forcedShell || pick(SHELLS),
    color: pick(PALETTE),
    color2: pick(PALETTE),
    trail: []
  });
  playLaunch();
}

function burst(x, y, color, opts) {
  const n = Math.floor(opts.count * (reducedMotion ? 0.45 : 1));
  for (let i = 0; i < n; i++) {
    const a = opts.ring ? (i / n) * Math.PI * 2 + rand(-0.03, 0.03) : rand(0, Math.PI * 2);
    const s = opts.ring ? opts.speed : rand(opts.speed * 0.3, opts.speed);
    particles.push(makeParticle(x, y, Math.cos(a) * s, Math.sin(a) * s,
      opts.multi ? pick(PALETTE) : color, opts));
  }
}

function explode(r) {
  const x = r.x, y = r.y;

  if (r.shell === 'tricolore') {
    burst(x, y, COLORS.bleu,  { count: 60, speed: 8.2, ring: true, decay: rand(0.007,0.010), gravity: 0.030, drag: 0.985, size: 2.6 });
    burst(x, y, COLORS.blanc, { count: 52, speed: 5.8, ring: true, decay: rand(0.007,0.010), gravity: 0.030, drag: 0.985, size: 2.4 });
    burst(x, y, COLORS.rouge, { count: 44, speed: 3.4, ring: true, decay: rand(0.007,0.010), gravity: 0.030, drag: 0.985, size: 2.4 });
    playBoom(1.25);
  } else if (r.shell === 'willow') {
    burst(x, y, COLORS.gold, { count: 110, speed: 7, decay: rand(0.0028,0.005), gravity: 0.05, drag: 0.992, size: 2.1, trail: true });
    playBoom(1);
  } else if (r.shell === 'crackle') {
    burst(x, y, COLORS.blanc, { count: 90, speed: 8.5, decay: rand(0.010,0.016), gravity: 0.032, drag: 0.978, size: 2.4, crackle: true });
    playBoom(1.1);
    playCrackle();
  } else if (r.shell === 'chrys') {
    burst(x, y, r.color, { count: 130, speed: 9, decay: rand(0.006,0.010), gravity: 0.034, drag: 0.984, size: 2.3, trail: true });
    playBoom(1.15);
  } else if (r.shell === 'double') {
    // Two-tone double break: outer sphere one color, delayed inner pistil another
    burst(x, y, r.color, { count: 110, speed: 9.5, decay: rand(0.007,0.010), gravity: 0.032, drag: 0.983, size: 2.4 });
    const c2 = r.color2;
    setTimeout(() => {
      burst(x, y, c2, { count: 60, speed: 4.2, decay: 0.012, gravity: 0.03, drag: 0.982, size: 2.6 });
      playBoom(0.7);
    }, 180);
    playBoom(1.2);
  } else if (r.shell === 'palm') {
    // Thick rising arms with heavy trails
    burst(x, y, pick([COLORS.gold, COLORS.gold, COLORS.rouge]),
      { count: 34, speed: 8, decay: rand(0.005,0.008), gravity: 0.055, drag: 0.993, size: 3.4, trail: true });
    playBoom(1.1);
  } else { // peony — multicolor half the time
    const multi = Math.random() < 0.5;
    burst(x, y, r.color, { count: 140, speed: 9.5, decay: rand(0.007,0.012), gravity: 0.031, drag: 0.982, size: 2.5, multi });
    playBoom(1.15);
  }
  // Central flash
  particles.push(makeParticle(x, y, 0, 0, COLORS.blanc, {
    decay: 0.07, gravity: 0, drag: 1, size: 38, flash: true
  }));
  // Smoke plume left hanging where the shell broke
  spawnSmoke(x, y, r.shell === 'willow' || r.shell === 'palm' ? COLORS.gold : r.color, 10);
}

function makeParticle(x, y, vx, vy, color, opts) {
  return {
    x, y, vx, vy, color,
    life: 1,
    decay: opts.decay,
    gravity: opts.gravity,
    drag: opts.drag,
    size: opts.size,
    trail: !!opts.trail,
    crackle: !!opts.crackle,
    flash: !!opts.flash,
    px: x, py: y
  };
}

/* ============================== Modes ============================== */
let autoMode = false, autoTimer = 0;
let finaleQueue = 0, finaleTimer = 0;

function startFinale() {
  finaleQueue = reducedMotion ? 14 : 26;
  hideHint();
}

/* ============================== Loop ============================== */
let last = performance.now();

function frame(now) {
  const dt = Math.min((now - last) / 16.67, 3);
  last = now;

  // Fade previous frame toward transparent (photo shows through)
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0, 0, W, H);

  // Auto mode
  if (autoMode && finaleQueue === 0) {
    autoTimer -= dt;
    if (autoTimer <= 0) {
      launch(rand(W * 0.15, W * 0.85), rand(H * 0.10, H * 0.42));
      autoTimer = rand(38, 85);
    }
  }
  // Finale
  if (finaleQueue > 0) {
    finaleTimer -= dt;
    if (finaleTimer <= 0) {
      launch(rand(W * 0.1, W * 0.9), rand(H * 0.08, H * 0.48),
             finaleQueue === 1 ? 'tricolore' : undefined);
      finaleQueue--;
      finaleTimer = rand(5, 14);
    }
  }

  // Smoke: soft, slow, drawn under the sparks (normal blending, not additive)
  ctx.globalCompositeOperation = 'source-over';
  for (let i = smoke.length - 1; i >= 0; i--) {
    const s = smoke[i];
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.r += s.growth * dt;
    s.life -= s.decay * dt;
    if (s.life <= 0) { smoke.splice(i, 1); continue; }
    // Rises then thins: opacity peaks early, fades long
    const a = Math.min(s.life, 0.85) * 0.13;
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
    // faint tint of the burst color in the core, neutral gray at the edge
    g.addColorStop(0, `hsla(${s.tint.h},${Math.round(s.tint.s*0.25)}%,72%,${a})`);
    g.addColorStop(0.6, `rgba(165,170,185,${a * 0.7})`);
    g.addColorStop(1, 'rgba(165,170,185,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'lighter';

  // Rockets
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.x += r.vx * dt;
    r.y += r.vy * dt;
    r.vy += 0.015 * dt;
    ctx.fillStyle = hsl(COLORS.gold, 82, 0.95);
    ctx.beginPath();
    ctx.arc(r.x + rand(-1, 1), r.y, 1.6, 0, Math.PI * 2);
    ctx.fill();
    if (r.y <= r.ty || r.vy > -1.5) {
      explode(r);
      rockets.splice(i, 1);
    }
  }

  // Particles
  if (particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.px = p.x; p.py = p.y;
    p.vx *= Math.pow(p.drag, dt);
    p.vy = p.vy * Math.pow(p.drag, dt) + p.gravity * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }

    if (p.flash) {
      ctx.fillStyle = hsl(p.color, 96, p.life * 0.7);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
      continue;
    }
    const alpha = p.life;
    // Subtle comet tail: short stretch along the velocity, so the color stays dominant
    const speed = Math.hypot(p.vx, p.vy);
    const tail = p.trail ? 3 : 1.2 + speed * 0.35;
    ctx.strokeStyle = hsl(p.color, undefined, alpha);
    ctx.lineCap = 'round';
    ctx.lineWidth = p.size * (0.35 + p.life * 0.65);
    ctx.beginPath();
    ctx.moveTo(p.x - p.vx * tail, p.y - p.vy * tail);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    // Head: a brighter tint of the same color, not white
    if (p.life > 0.45) {
      ctx.fillStyle = hsl(p.color, Math.min(p.color.l + 18, 88), alpha * 0.6);
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.7, p.size * 0.4 * p.life), 0, Math.PI * 2);
      ctx.fill();
    }
    if (p.crackle && Math.random() < 0.08 * dt) {
      ctx.fillStyle = hsl(COLORS.gold, 88, 1);
      ctx.beginPath();
      ctx.arc(p.x + rand(-4, 4), p.y + rand(-4, 4), 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  requestAnimationFrame(frame);
}

/* ============================== UI ============================== */
const btnSound = document.getElementById('btnSound');
const btnAuto = document.getElementById('btnAuto');
const btnFinale = document.getElementById('btnFinale');
const btnLang = document.getElementById('btnLang');
const hint = document.getElementById('hint');
let hintHidden = false;

function hideHint() {
  if (!hintHidden) { hint.classList.add('hidden'); hintHidden = true; }
}

function applyLang() {
  const s = STRINGS[lang];
  document.getElementById('subtitle').textContent = s.subtitle;
  btnSound.querySelector('span').textContent = s.sound;
  btnAuto.querySelector('span').textContent = s.auto;
  btnFinale.querySelector('span').textContent = s.finale;
  hint.textContent = s.hint;
  btnLang.textContent = s.lang;
  document.documentElement.lang = lang;
}

btnSound.addEventListener('click', () => {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  soundOn = !soundOn;
  btnSound.classList.toggle('on', soundOn);
  btnSound.setAttribute('aria-pressed', soundOn);
  btnSound.firstChild.textContent = soundOn ? '🔊 ' : '🔇 ';
});

btnAuto.addEventListener('click', () => {
  autoMode = !autoMode;
  btnAuto.classList.toggle('on', autoMode);
  btnAuto.setAttribute('aria-pressed', autoMode);
  if (autoMode) { autoTimer = 0; hideHint(); }
});

btnFinale.addEventListener('click', startFinale);

btnLang.addEventListener('click', () => {
  lang = lang === 'fr' ? 'en' : 'fr';
  applyLang();
});

canvas.addEventListener('pointerdown', e => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  launch(e.clientX, e.clientY);
  hideHint();
});

// Init
resize();
applyLang();
setTimeout(() => launch(W * 0.5, H * 0.22, 'tricolore'), 700);
requestAnimationFrame(frame);
</script>
</body>
</html>
